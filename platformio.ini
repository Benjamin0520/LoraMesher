; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env]
lib_deps =
    https://github.com/jgromes/RadioLib#7.6.0
monitor_filters =
    esp32_exception_decoder
    log2file
extra_scripts =
    pre:scripts/platform_compat.py
    scripts/extra_script.py

[test_base]
build_src_filter = +<*> +<../scripts/build_check/main.cpp>
lib_deps =
    ${env.lib_deps}
    google/googletest@^1.12.1
test_build_src = yes
test_framework = googletest

[env:test_native]
extends = test_base
platform = native
build_type = debug
build_flags =
    -DDEBUG
    -fsanitize=address,undefined
    -fno-sanitize=vptr
    -fno-omit-frame-pointer
    -g

[env:test_native_tsan]
extends = test_base
platform = native
build_type = debug
build_flags =
    -DDEBUG
    -fsanitize=thread
    -fno-omit-frame-pointer
    -g

[env:test_native_profile]
extends = test_base
platform = native
build_type = release
build_flags =
    -DDEBUG
    -fprofile-instr-generate
    -fcoverage-mapping
    -fno-omit-frame-pointer
    -g

[env:test_native_xray]
extends = test_base
platform = native
build_type = release
build_flags =
    -DDEBUG
    -fxray-instrument
    -fxray-instruction-threshold=1
    -fno-omit-frame-pointer
    -g

[env:native]
extends = test_base
platform = native

[env:esp32]
build_src_filter = +<*> +<../examples/simple_example/src/main.cpp>
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=2000
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
    -Wstack-usage=2048
    -Wframe-larger-than=2048
    -std=gnu++2a
